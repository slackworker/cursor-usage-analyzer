[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-usage-calculator"
version = "0.1.0"
description = "Estimate Cursor token costs and plan pool usage from CSV exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
cursor-usage = "cursor_usage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cursor_usage*"]
